# FEATURES.yaml — Wroom
#
# BOOTSTRAP FILE. Hand-written, because Wroom doesn't exist yet to generate it.
# Once WRM-052 (export) is built, Wroom overwrites this file and the normal
# CLAUDE.md §9 rule applies: never hand-edit. Until then, Jaya edits it.
#
# status:   backlog | todo | in-progress | blocked | review | done
# priority: low | medium | high | critical
# size:     xs | s | m | l | xl

source: manual-bootstrap
project: wroom
exportedAt: 2026-08-18T00:00:00Z
exportVersion: 0
offlineEdits: true

features:

  # ---------------------------------------------------------------
  # Foundation
  # ---------------------------------------------------------------

  - ref: WRM-000
    title: Walking skeleton — monorepo, API, both frontends, deployed
    status: done
    priority: critical
    size: l
    labels: [foundation, api, portal, portfolio, deploy]
    acceptance: Log in on the deployed portal, create a project, refresh, it persists from Atlas; portfolio URL loads its empty state.

  - ref: WRM-001
    title: Rollup recompute service
    status: done
    completedAt: 2026-08-17
    priority: high
    size: m
    labels: [api, foundation]
    dependsOn: [WRM-000]
    acceptance: projects.rollup recomputes in the service layer on any change to features, costs, revenue or time entries for that project.

  - ref: WRM-002
    title: Shared validation schemas in packages/shared
    status: done
    completedAt: 2026-08-17
    priority: high
    size: s
    labels: [api, foundation]
    acceptance: Every write endpoint validates against a Zod schema imported from packages/shared; no inline validation in controllers.

  - ref: WRM-003
    title: Dashboard home
    status: in-progress
    priority: high
    size: m
    labels: [portal]
    dependsOn: [WRM-001]
    acceptance: Home shows project count by status, total monthly run-rate, credentials expiring within 30 days, and last activity per project.

  # ---------------------------------------------------------------
  # Core records
  # ---------------------------------------------------------------

  - ref: WRM-010
    title: Products CRUD
    status: in-progress
    priority: high
    size: s
    labels: [portal, api]
    acceptance: Create, edit and archive a product with isClientWork and ndaRestricted flags; projects can be assigned to it.

  - ref: WRM-011
    title: Project edit, archive and delete
    status: review
    priority: high
    size: m
    labels: [portal, api]
    acceptance: Edit all project fields including type-specific ones; archive hides from default list; delete requires typed confirmation.

  - ref: WRM-012
    title: Project list filters and search
    status: review
    priority: medium
    size: s
    labels: [portal]
    acceptance: Filter by status, product, type and tag; free-text search on name; filters persist in the URL.

  - ref: WRM-013
    title: Accounts CRUD
    status: review
    priority: high
    size: s
    labels: [portal, api]
    acceptance: Register a vendor account with login email, account ref and isPrimary flag; secondary accounts are visually distinct.

  - ref: WRM-014
    title: Environments per project
    status: review
    priority: high
    size: m
    labels: [portal, api]
    acceptance: Add dev/staging/production to a project, each with branch and public URL; the primary environment shows on the project card.

  - ref: WRM-015
    title: Services per environment
    status: review
    priority: high
    size: m
    labels: [portal, api]
    dependsOn: [WRM-013, WRM-014]
    acceptance: Add a service with role, vendor, account, resource name and externalRef; the project page shows what runs where and on which account.

  - ref: WRM-016
    title: Project links graph
    status: review
    priority: medium
    size: m
    labels: [portal, api]
    acceptance: Link two projects with a type; project page lists both directions and answers "what depends on this".

  - ref: WRM-017
    title: Credentials registry
    status: review
    priority: high
    size: m
    labels: [portal, api]
    acceptance: Record a credential's location, expiry and renewal cost; API rejects any attempt to store a value; expiring-soon list is queryable.

  - ref: WRM-018
    title: Notes per project
    status: review
    priority: medium
    size: s
    labels: [portal, api]
    acceptance: Add, pin and edit markdown notes on a project; pinned notes appear first.

  - ref: WRM-019
    title: Decision log
    status: review
    priority: medium
    size: s
    labels: [portal, api]
    acceptance: Record a decision with context, choice and rejected alternatives; superseding a decision links the two.

  - ref: WRM-020
    title: Project types admin
    status: backlog
    priority: low
    size: m
    labels: [portal, api]
    acceptance: Add a project type and its fieldDefs through the UI; the create-project form picks it up without a deploy.

